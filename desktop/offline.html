<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Renamer Pro — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(60% 60% at 50% 0%, #241b5e 0%, #070b18 70%);
        color: #e6e8f2; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center; padding: 24px;
      }
      .card { max-width: 420px; }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 999px;
        display: grid; place-items: center; font-size: 30px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #9aa1bd; margin: 0 0 22px; }
      button {
        border: 0; cursor: pointer; color: #fff; font-size: 14px; font-weight: 600;
        padding: 11px 26px; border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 8px 22px rgba(99, 102, 241, 0.35);
      }
      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>No internet connection</h1>
      <p>
        Page Renamer Pro needs internet to load. Please check your connection
        and try again.
      </p>
      <button onclick="location.href='https://page-renamer-pro.vercel.app/'">
        Try again
      </button>
    </div>
  </body>
</html>
